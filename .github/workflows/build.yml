name: Merge Subscriptions

on:
  schedule:
    - cron: '0 */4 * * *'  # هر ۴ ساعت یکبار
  workflow_dispatch:        # قابلیت اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # اجازه commit و push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run merge script
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: python scripts/merge_subscriptions.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/config.yaml
          git diff --staged --quiet || git commit -m "Update config.yaml [skip ci]"
          git push
